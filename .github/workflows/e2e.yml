name: E2E Automation Testing CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-e2e-and-generate-reports:
    name: E2E Tests and Reports
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Node dependencies
      run: |
        cd testing/node_selenium
        npm install

    - name: Run Web E2E tests
      run: |
        cd testing/node_selenium
        node test_runner.js
      env:
        TEST_TARGET_URL: "http://localhost:8080"

    - name: Install Python dependencies
      run: |
        cd testing
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install openpyxl

    - name: Run Appium E2E tests
      run: |
        cd testing/appium_tests
        python run_appium_tests.py

    - name: Generate API Unit, Validation, Deployment, and Load results
      run: |
        cd testing
        python generate_results.py

    - name: Run Master Compiler & Vulnerability Report
      run: |
        cd testing
        python generate_vuln_sheet.py
        python compile_master_report.py

    - name: Upload Master Excel Test Report
      uses: actions/upload-artifact@v4
      with:
        name: full-e2e-report
        path: testing/test_report.xlsx

    - name: Upload Selenium Web Report
      uses: actions/upload-artifact@v4
      with:
        name: selenium-web-report
        path: testing/selenium_web_report.xlsx

    - name: Upload Appium Android Report
      uses: actions/upload-artifact@v4
      with:
        name: appium-android-report
        path: testing/appium_android_report.xlsx

    - name: Upload Unit Test Report
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-report
        path: testing/unit_test_report.xlsx

    - name: Upload Validation Test Report
      uses: actions/upload-artifact@v4
      with:
        name: validation-test-report
        path: testing/validation_test_report.xlsx

    - name: Upload Deployment Test Report
      uses: actions/upload-artifact@v4
      with:
        name: deployment-test-report
        path: testing/deployment_test_report.xlsx

    - name: Upload Load Test Report
      uses: actions/upload-artifact@v4
      with:
        name: load-test-report
        path: testing/load_test_report.xlsx

    - name: Upload Vulnerability Report Excel
      uses: actions/upload-artifact@v4
      with:
        name: vulnerability-test-report
        path: "Vulnerability Test Results/Vulnerability_Report.xlsx"
